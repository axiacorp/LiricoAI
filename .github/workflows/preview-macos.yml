name: Lírico AI macOS Preview

on:
  push:
    branches:
      - fix/liricoai-packaging
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-preview:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      BUZZ_DISABLE_TELEMETRY: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          save-cache: false

      - name: Install dependencies
        run: uv sync

      - uses: AnimMouse/setup-ffmpeg@v1
        with:
          version: "711"

      - name: Build unsigned macOS DMG
        shell: bash
        run: |
          brew untap aws/tap || true
          brew install create-dmg
          uv run make bundle_mac_unsigned

      - name: Normalize installer name
        shell: bash
        run: |
          DMG="$(find dist -maxdepth 1 -name 'LiricoAI*-mac.dmg' -print -quit)"
          if [ -z "$DMG" ]; then
            echo "DMG not found"
            exit 1
          fi
          cp "$DMG" "dist/LiricoAI-macOS-ARM64.dmg"

      - name: Create or update preview release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view liricoai-test >/dev/null 2>&1; then
            gh release upload liricoai-test dist/LiricoAI-macOS-ARM64.dmg --clobber
          else
            gh release create liricoai-test dist/LiricoAI-macOS-ARM64.dmg \
              --title "Lírico AI — versão de teste para macOS" \
              --notes "Versão de teste do Lírico AI para macOS Apple Silicon. Baixe diretamente o arquivo .dmg." \
              --prerelease
          fi
