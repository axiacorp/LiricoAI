name: Lírico AI macOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - "ui/macos-modern-dashboard"
    paths:
      - "buzz/**"
      - "Buzz.spec"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/lirico-macos.yml"

concurrency:
  group: lirico-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build Lírico AI for macOS (Apple Silicon)
    runs-on: macos-15
    env:
      BUZZ_DISABLE_TELEMETRY: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          brew update
          brew install ffmpeg gettext create-dmg

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Build whisper.cpp for Apple Silicon
        run: uv run make buzz/whisper_cpp

      - name: Build Lírico AI app
        run: uv run pyinstaller --noconfirm Buzz.spec

      - name: Package ZIP
        run: |
          ditto -c -k --keepParent "dist/LiricoAI.app" "dist/LiricoAI-macOS-arm64.zip"

      - name: Package DMG
        run: |
          rm -rf dist/dmg
          mkdir -p dist/dmg
          cp -R "dist/LiricoAI.app" dist/dmg/
          create-dmg \
            --volname "Lírico AI" \
            --volicon "./buzz/assets/buzz.icns" \
            --window-pos 200 120 \
            --window-size 620 330 \
            --icon-size 104 \
            --icon "LiricoAI.app" 175 145 \
            --hide-extension "LiricoAI.app" \
            --app-drop-link 445 145 \
            "dist/LiricoAI-macOS-arm64.dmg" \
            "dist/dmg/" || true

      - name: Verify bundle
        run: |
          test -d "dist/LiricoAI.app"
          test -f "dist/LiricoAI.app/Contents/MacOS/LiricoAI"
          /usr/bin/file "dist/LiricoAI.app/Contents/MacOS/LiricoAI"

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: LiricoAI-macOS-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/LiricoAI-macOS-arm64.zip
            dist/LiricoAI-macOS-arm64.dmg
